[package]
name = "cm255-arkworks-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
ark-std = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-ff = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-poly = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-bls12-381 = { version = "=0.6.0", default-features = false, features = ["std", "scalar_field"] }
ark-bn254 = { version = "=0.6.0", default-features = false, features = ["std", "scalar_field"] }

[features]
default = []
asm = ["ark-ff/asm"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false

[profile.test]
opt-level = 3
